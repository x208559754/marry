<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 熔蜡外溢主裙渐变 (朱红/深酒红/暗血石蜡质) -->
    <radialGradient id="waxPuddleGrad" cx="38%" cy="36%" r="62%" fx="30%" fy="28%">
      <stop offset="0%" stop-color="#E04646"/>
      <stop offset="25%" stop-color="#BA2626"/>
      <stop offset="60%" stop-color="#881515"/>
      <stop offset="85%" stop-color="#5E0D0D"/>
      <stop offset="100%" stop-color="#3D0606"/>
    </radialGradient>

    <!-- 挤压蜡环高光渐变 -->
    <linearGradient id="waxRimHigh" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FF7575" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#D93838" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7A1010" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3A0505"/>
    </linearGradient>

    <!-- 凹陷印章芯渐变 -->
    <radialGradient id="waxBasinGrad" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#6E0F0F"/>
      <stop offset="65%" stop-color="#500A0A"/>
      <stop offset="100%" stop-color="#380606"/>
    </radialGradient>

    <!-- 描金金粉双喜渐变 -->
    <linearGradient id="goldXiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="35%" stop-color="#F5D36C"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7818"/>
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="waxShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4A100C" flood-opacity="0.45"/>
    </filter>

    <filter id="goldGlow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#400808" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#waxShadow)">
    <!-- 1. 最外层不规则融化熔蜡裙边 (Organic Molten Wax Outskirt，非正圆自然溢蜡波纹) -->
    <path d="M102,12 
             C126,10 148,18 165,34 
             C181,49 191,68 189,92 
             C188,114 195,133 182,152 
             C171,168 152,183 131,188 
             C109,193 88,185 68,186 
             C47,187 29,173 18,154 
             C7,135 12,112 11,92 
             C10,69 22,46 39,31 
             C57,17 78,13 102,12 Z" 
          fill="url(#waxPuddleGrad)"/>

    <!-- 2. 局部熔蜡外溢滴凸包 (Natural wax drips & spill lobes) -->
    <!-- 右上方凸溢 -->
    <path d="M145,26 C162,20 178,36 172,52 C166,42 156,32 145,26 Z" fill="#991C1C" opacity="0.6"/>
    <!-- 右下方重滴溢蜡 -->
    <path d="M168,138 C188,150 176,178 154,176 C162,166 172,154 168,138 Z" fill="#691010" opacity="0.7"/>
    <!-- 左侧流动褶皱 -->
    <path d="M22,78 C12,94 14,120 28,128 C20,114 18,92 22,78 Z" fill="#BA2828" opacity="0.5"/>
    <!-- 底部厚蜡堆积 -->
    <path d="M82,182 C98,194 122,192 136,184 C120,188 98,188 82,182 Z" fill="#4A0B0B" opacity="0.6"/>

    <!-- 3. 印章压痕外凸环 (Raised Stamp Lip - 挤压出的不规则蜡环) -->
    <path d="M101,24 
             C138,23 172,51 173,95 
             C174,136 142,172 101,173 
             C61,174 27,140 26,98 
             C25,56 61,25 101,24 Z" 
          fill="none" stroke="url(#waxRimHigh)" stroke-width="9"/>

    <path d="M101,28 
             C136,27 167,54 168,96 
             C169,134 139,168 101,169 
             C63,170 32,137 31,98 
             C30,59 64,29 101,28 Z" 
          fill="none" stroke="#5E0D0D" stroke-width="3" opacity="0.7"/>

    <!-- 4. 凹陷中央印泥台盆 (Sunken Basin) -->
    <path d="M100,34 
             C132,33 161,59 162,97 
             C163,131 135,162 100,163 
             C65,164 37,133 36,98 
             C35,62 67,35 100,34 Z" 
          fill="url(#waxBasinGrad)"/>

    <!-- 5. 宣纸/蜡质光斑 (Top-left specular reflection) -->
    <path d="M52,48 C72,36 94,36 108,38 C88,42 68,52 52,68 C48,60 50,52 52,48 Z" 
          fill="#FFA4A4" opacity="0.32"/>

    <!-- 6. 内圈复古烫金细珠点链环 (Gold Bead/Rope Inner Ring) -->
    <circle cx="99" cy="98" r="54" fill="none" stroke="url(#goldXiGrad)" stroke-width="1.8" stroke-dasharray="3 3.5" opacity="0.75"/>

    <!-- 7. 核心中式浮雕双喜（囍）字样 - 扫金粉高贵立体质感 (Embossed Gold Double Happiness) -->
    <g transform="translate(100, 99) scale(0.92)" filter="url(#goldGlow)">
      <!-- 囍字外发光/阴影衬底 -->
      <path d="
        M-32,-32 L-20,-32 L-20,-26 L-14,-26 L-14,-32 L-2,-32 L-2,-26 L2,-26 L2,-32 L14,-32 L14,-26 L20,-26 L20,-32 L32,-32 L32,-22 L20,-22 L20,-16 L32,-16 L32,-6 L20,-6 L20,0 L34,0 L34,10 L20,10 L20,16 L32,16 L32,32 L20,32 L20,34 L12,34 L12,32 L-12,32 L-12,34 L-20,34 L-20,32 L-32,32 L-32,16 L-20,16 L-20,10 L-34,10 L-34,0 L-20,0 L-20,-6 L-32,-6 L-32,-16 L-20,-16 L-20,-22 L-32,-22 Z
      " fill="#360505" opacity="0.45" transform="translate(0, 2)"/>

      <!-- 经典高精度正统汉字双喜路径 (Double Happiness calligraphy) -->
      <!-- 左侧喜 -->
      <!-- 上半部：士与口 -->
      <rect x="-30" y="-30" width="24" height="4" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="-19" y="-34" width="4" height="12" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="-26" y="-23" width="16" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <!-- 口 -->
      <path d="M-27,-17 L-11,-17 L-11,-9 L-27,-9 Z M-23,-14 L-15,-14 L-15,-12 L-23,-12 Z" fill="url(#goldXiGrad)"/>
      <!-- 横连线 -->
      <rect x="-32" y="-6" width="28" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="-19" y="-7" width="4" height="8" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="-32" y="3" width="28" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <!-- 下半部口 -->
      <path d="M-28,9 L-10,9 L-10,23 L-28,23 Z M-24,12.5 L-14,12.5 L-14,19.5 L-24,19.5 Z" fill="url(#goldXiGrad)"/>

      <!-- 右侧喜 -->
      <!-- 上半部：士与口 -->
      <rect x="6" y="-30" width="24" height="4" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="16" y="-34" width="4" height="12" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="10" y="-23" width="16" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <!-- 口 -->
      <path d="M9,-17 L25,-17 L25,-9 L9,-9 Z M13,-14 L21,-14 L21,-12 L13,-12 Z" fill="url(#goldXiGrad)"/>
      <!-- 横连线 -->
      <rect x="4" y="-6" width="28" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="16" y="-7" width="4" height="8" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="4" y="3" width="28" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <!-- 下半部口 -->
      <path d="M8,9 L26,9 L26,23 L8,23 Z M12,12.5 L22,12.5 L22,19.5 L12,19.5 Z" fill="url(#goldXiGrad)"/>

      <!-- 喜字中间金线点缀 (Central joining bridge) -->
      <rect x="-4" y="-6" width="8" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <rect x="-4" y="3" width="8" height="3.5" rx="1" fill="url(#goldXiGrad)"/>
      <circle cx="0" cy="16" r="2.2" fill="url(#goldXiGrad)"/>
    </g>

    <!-- 8. 散落熔金细粉 (Gold dust specks) -->
    <circle cx="68" cy="40" r="1.2" fill="#FFEAA8" opacity="0.8"/>
    <circle cx="140" cy="52" r="1.5" fill="#FFEAA8" opacity="0.7"/>
    <circle cx="152" cy="115" r="1.2" fill="#FFEAA8" opacity="0.85"/>
    <circle cx="56" cy="142" r="1.4" fill="#FFEAA8" opacity="0.75"/>
    <circle cx="118" cy="160" r="1.2" fill="#FFEAA8" opacity="0.9"/>
  </g>
</svg>
